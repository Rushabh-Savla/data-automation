server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing — any path that isn't a real static file falls
    # back to index.html so React Router's routes resolve on a hard refresh.
    location / {
        try_files $uri /index.html;
    }

    # Same-origin proxy to the API service — the browser never sees a
    # cross-origin request, so CORS is never actually exercised in this
    # deployment path.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket upgrade — must carry the Upgrade/Connection headers through
    # for the handshake to succeed, plain proxy_pass alone is not enough.
    location /ws/ {
        proxy_pass http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
