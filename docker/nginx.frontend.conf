map $http_x_api_key $api_key_header {
    default $http_x_api_key;
    ""      "dev-local-key";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=5s;

    # SPA client-side routing — any path that isn't a real static file falls
    # back to index.html so React Router's routes resolve on a hard refresh.
    location / {
        try_files $uri /index.html;
    }

    # Same-origin proxy to the API service — the browser never sees a
    # cross-origin request, so CORS is never actually exercised in this
    # deployment path.
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $api_key_header;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # WebSocket upgrade — must carry the Upgrade/Connection headers through
    # for the handshake to succeed, plain proxy_pass alone is not enough.
    location /ws/ {
        set $ws_upstream http://api:8000;
        proxy_pass $ws_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
