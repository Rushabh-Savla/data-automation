[project]
name = "data-automation-platform"
version = "0.1.0"
# Upper-bounded to match docker/Dockerfile.worker's python:3.13-slim base. Without
# the bound uv resolves the local dev venv to 3.14 while the container runs
# 3.13, and the two stop agreeing on what is installable -- the CUDA torch
# build this project pins only ships cp313 wheels, so a 3.14 dev venv cannot
# install the same dependency set the image does.
requires-python = ">=3.13,<3.14"
dependencies = [
    # -- Web / API --------------------------------------------------------
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # -- Database -----------------------------------------------------------
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    # -- Task queue / broker -------------------------------------------------
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "flower>=2.0.1",
    # -- Security -------------------------------------------------------------
    "cryptography>=43.0.0",
    # -- Source connectors (existing, reused) ----------------------------------
    "deno>=2.9.5",
    "kaggle>=1.6.0",
    "kagglehub>=0.2.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.28.0",
    "roboflow>=1.1.0",
    "scenedetect[opencv]>=0.6.3",
    "yt-dlp>=2024.1.0",
    # -- Web scraping connector -------------------------------------------------
    "ddgs>=9.0.0",
    "img2dataset>=1.45.0",
    # img2dataset (and a couple of its own deps) still import the stdlib
    # `imghdr` module, which was removed in Python 3.13 — this backport
    # package restores it. Without it, `import img2dataset` raises
    # ModuleNotFoundError on this project's >=3.13 interpreter.
    "standard-imghdr>=3.13.0; python_version >= '3.13'",
    # -- Relevance filtering / dedup ---------------------------------------------
    "ultralytics>=8.3.0",
    # YOLO-World's open-vocabulary text embedding (RelevanceFilter.score ->
    # model.set_classes()) needs this CLIP fork at import time — ultralytics
    # will *try* to auto-install it on first use via `uv pip install git+...`
    # if it's missing, but that requires `git` and network access at
    # inference time and fails silently into "0 relevance score for every
    # image" (see app/filtering/yolo_world_filter.py) when either is
    # unavailable. Pinning it here bakes it into the image at build time.
    "clip @ git+https://github.com/ultralytics/CLIP.git",
    "imagehash>=4.3.1",
    "numpy>=1.26.0",
    # SmolVLM-256M second-opinion visual check (app/filtering/smolvlm_filter.py)
    "transformers>=4.45.0",
    # torch/torchvision are pinned to a CUDA 12.4 build rather than left to
    # whatever ultralytics resolves. PyPI's default torch wheel is currently
    # built against CUDA 13.0, which refuses to initialise on this host:
    #
    #   UserWarning: CUDA initialization: The NVIDIA driver on your system is
    #   too old (found version 12020)
    #
    # so torch.cuda.is_available() returned False and every relevance-filter
    # inference silently ran on CPU at ~66s/image while an idle RTX A4000 sat
    # next to it. Driver 535.x is CUDA 12.2; CUDA minor-version compatibility
    # means a cu124 build runs on it fine (verified on this host: A4000
    # detected, matmul OK). Pinning here rather than upgrading the host
    # driver, because this machine also runs unrelated production workloads
    # that a driver change would disrupt.
    # Cron parsing for recurring job schedules (app/services/schedule_service.py).
    "croniter>=3.0.0",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "smbprotocol>=1.17.0",
    "paramiko>=5.0.0",
    "defusedxml>=0.7.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

# explicit = true: only the packages named in [tool.uv.sources] above are
# pulled from this index. Without it every dependency would be resolved
# against the PyTorch index first, which does not mirror all of PyPI.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "respx>=0.21.1",
    "freezegun>=1.5.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
